# Disaster Response Multi-Agent System - Default Configuration

environment:
  grid_size: [10, 10]
  max_steps: 50
  num_zones: 4
  num_depots: 2
  
  # Severity levels: 1 (Low), 2 (Medium), 3 (High)
  zone_severities: [1, 2, 3]

  # Zone size & dynamic variation configuration
  default_zone_size: 1
  zone_size_range: [1, 3]
  randomize_zone_sizes: false
  dynamic_zone_sizes: false
  size_change_prob: 0.15
  
  casualty_ranges:
    1: [1, 3]
    2: [4, 6]
    3: [7, 10]
    
  trapped_ranges:
    1: [1, 2]
    2: [2, 4]
    3: [4, 7]
    
  depot_stock:
    ambulances: 5
    rescue_teams: 5
    supply_units: 20

  agent_counts:
    medical: 2
    rescue: 2
    logistics: 2

  time_thresholds:
    medical_treat_delay: 8
    rescue_delay: 10

  inaccessible_prob: 0.2
  inaccessible_cost: 2
  rescue_duration: 2
  demand_growth_rate: 0.2
  seed: 42

comms:
  comm_enabled: true
  comm_dropout_prob: 0.1

rewards:
  medical:
    treated_on_time: 10.0
    delay_penalty: 1.0
    lost_casualty_penalty: 20.0

  rescue:
    rescued_person: 15.0
    delay_penalty: 0.5
    unrescued_penalty: 10.0

  logistics:
    demand_fulfilled: 8.0
    shortage_penalty: 2.0
    waste_penalty: 5.0

  team_reward_weight: 0.2

db:
  uri: "mongodb://localhost:27017/"
  database: "disaster_metrics"

training:
  total_timesteps: 200000
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  epochs: 10
  batch_size: 64
  rollout_length: 128
  checkpoint_dir: "checkpoints"
  checkpoint_freq: 50
