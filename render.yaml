services:
  - type: web
    name: disaster-response-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGINS
        value: https://majorproject2026-2027.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: '^https://majorproject2026-2027-[a-z0-9-]+-aditya-chandravanshis-projects\.vercel\.app$'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: disaster_metrics
      - key: MONGODB_REQUIRED
        value: "true"
