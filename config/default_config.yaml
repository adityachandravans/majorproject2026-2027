# Disaster Response Multi-Agent System - Default Configuration

environment:
  grid_size: [10, 10]
  max_steps: 50
  num_zones: 4
  num_depots: 2
  
  # Severity levels: 1 (Low), 2 (Medium), 3 (High)
  zone_severities: [1, 2, 3]
  
  casualty_ranges:
    1: [1, 3]
    2: [4, 6]
    3: [7, 10]
    
  trapped_ranges:
    1: [1, 2]
    2: [2, 4]
    3: [4, 7]
    
  depot_stock:
    ambulances: 5
    rescue_teams: 5
    supply_units: 20

  agent_counts:
    medical: 2
    rescue: 2
    logistics: 2

  time_thresholds:
    medical_treat_delay: 8
    rescue_delay: 10

  seed: 42

rewards:
  medical:
    treated_on_time: 10.0
    delay_penalty: 1.0
    lost_casualty_penalty: 20.0

  rescue:
    rescued_person: 15.0
    delay_penalty: 0.5
    unrescued_penalty: 10.0

  logistics:
    demand_fulfilled: 8.0
    shortage_penalty: 2.0
    waste_penalty: 5.0

db:
  path: "disaster_metrics.db"

training:
  total_timesteps: 5000
  learning_rate: 0.0003
  checkpoint_dir: "checkpoints"
